<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with rounded corners for maskable safe-zone compliance -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  
  <!-- Outer subtle radar telemetry ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-opacity="0.2" />
  
  <!-- Central Globe Emblem -->
  <circle cx="256" cy="256" r="105" fill="url(#globeGrad)" filter="url(#glow)" />
  
  <!-- Continents/Eco-leaf motif -->
  <path d="M220 180 Q256 160 280 190 Q300 220 270 240 Q250 250 240 280 Q230 310 210 320 Q190 310 180 280 Q170 240 200 210 Z" fill="#047857" fill-opacity="0.85" />
  <path d="M290 260 Q330 240 340 280 Q330 320 290 330 Q260 330 280 290 Z" fill="#047857" fill-opacity="0.85" />
  
  <!-- Leaf sprout accent -->
  <path d="M256 140 C280 110 330 120 330 150 C330 180 290 190 256 190 Z" fill="#fef08a" />
  <path d="M256 190 Q290 170 330 150" stroke="#047857" stroke-width="4" fill="none" stroke-linecap="round" />
  
  <!-- Signal broadcast rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="90" r="12" fill="#34d399" />
</svg>
